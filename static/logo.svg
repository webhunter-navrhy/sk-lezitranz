<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 75" width="400" height="75">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Decorative line left -->
  <line x1="0" y1="28" x2="18" y2="28" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>

  <!-- Lehotský comp s.r.o. - DOMINANT -->
  <text x="26" y="33" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="2" fill="url(#grad)" filter="url(#glow)">Lehotský comp s.r.o.</text>

  <!-- Decorative line right -->
  <line x1="370" y1="28" x2="400" y2="28" stroke="url(#grad)" stroke-width="2" opacity="0.6"/>

  <!-- LEZITRANZ - subtitle -->
  <text x="26" y="58" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="6" fill="#94a3b8" opacity="0.8">LEZITRANZ</text>

  <!-- Thin separator line -->
  <line x1="26" y1="42" x2="160" y2="42" stroke="url(#grad)" stroke-width="1" opacity="0.3"/>
</svg>
